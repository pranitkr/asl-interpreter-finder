name = "asl-interpreter-finder"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Workers AI: called only from the Worker, never from the browser.
[ai]
binding = "AI"

# Run: npx wrangler kv namespace create DATA   then paste the id below.
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
